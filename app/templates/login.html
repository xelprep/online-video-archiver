<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Online Video Archiver</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f1115; color: #e6e6e6; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { background: #181c23; border: 1px solid #2a2f3a; border-radius: 12px;
          padding: 2.2rem 2rem; width: min(360px, 90vw); }
  h1 { font-size: 1.15rem; margin: 0 0 0.25rem; }
  .sub { color: #8b93a3; font-size: 0.85rem; margin: 0 0 1.4rem; }
  label { display: block; font-size: 0.85rem; color: #8b93a3; margin-bottom: 0.3rem; }
  input[type=password] { width: 100%; padding: 0.6rem 0.7rem; border-radius: 8px; border: 1px solid #2a2f3a;
         background: #0f1115; color: inherit; font: inherit; }
  button { margin-top: 1rem; width: 100%; padding: 0.6rem; border: 0; border-radius: 8px;
           background: #4f8cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #3d7bf0; }
  .error { margin-top: 1rem; color: #ff7b72; font-size: 0.85rem; min-height: 1.2em; }
  .version { margin-top: 1.4rem; color: #555c6b; font-size: 0.75rem; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Online Video Archiver</h1>
    <p class="sub">Enter the web password to continue.</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Sign in</button>
    <div class="error">{{ error or "" }}</div>
    <div class="version">v{{ version }}</div>
  </form>
</body>
</html>
