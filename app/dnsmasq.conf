# Local DNS cache for the archiver.
#
# yt-dlp makes a fresh connection (and a fresh resolver) for essentially every
# request to www.youtube.com, so without caching the container sends thousands
# of lookups per minute to the upstream resolver. dnsmasq answers repeated
# lookups from cache and forwards misses to the upstream server, which the
# entrypoint supplies on the command line (--server=...).
#
# no-resolv: do NOT read /etc/resolv.conf. The entrypoint rewrites that file to
# point at this cache, so reading it would create a resolution loop. The
# upstream comes from the --server option instead.
listen-address=127.0.0.1
bind-interfaces
no-resolv
cache-size=2000
# Cache negative answers (e.g. the NODATA IPv6 reply for www.youtube.com) so the
# AAAA half of each lookup is also served from cache instead of being re-forwarded
# to the upstream on every connection.
neg-ttl=300
