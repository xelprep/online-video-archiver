services:
  video-archiver:
    build: .
    container_name: online-video-archiver
    restart: unless-stopped
    environment:
      # Initial defaults only; runtime settings live in the SQLite settings table.
      POLL_MINUTES: "30"
      LOG_LEVEL: "INFO"
      DATA_DIR: "/data"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
