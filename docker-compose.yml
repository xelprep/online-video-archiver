services:
  video-archiver:
    build: .
    container_name: online-video-archiver
    restart: unless-stopped
    environment:
      # Required: password for the web UI. The app refuses to start if this is
      # unset or left as a placeholder (e.g. "change-me"). Set a strong value.
      WEB_PASSWORD: "change-me"
      # Initial defaults only; runtime settings live in the SQLite settings table.
      POLL_MINUTES: "30"
      # IANA timezone all refresh scheduling is anchored to (change it in the UI).
      TIMEZONE: "UTC"
      LOG_LEVEL: "INFO"
      DATA_DIR: "/data"
      # Base URL of the bgutil PO-token server peer container below. The
      # service name IS the hostname inside the compose network — plain-DNS
      # peer lookup. Overriding this to a host:port only makes sense if you
      # run the provider image yourself outside compose.
      POT_SERVER_URL: "http://bgutil-pot:4416"
      # Tor lane endpoint — see docs/anti-bot-egress.md ("One shared socket,
      # both containers"). The image binds tor's SOCKS socket to all interfaces
      # at 9051 (the torrc line the Dockerfile appends), so this container and
      # the bgutil-pot peer below share ONE socket: the peer mints through the
      # SAME exit node this container downloads through, instead of minting on
      # its own container IP and spending the token from a different exit. The
      # host must be container_name above — a peer never reaches a socket
      # through 127.0.0.1, it reaches it by name over the compose network, and
      # tor's built-in 127.0.0.1:9050 stops existing once the image carries a
      # SocksPort line. If you rename the container, rename this too. The
      # socket only listens while the Tor lane is live; until then this value
      # is inert and egress stays direct/pool. Seeding is INSERT OR IGNORE per
      # key (app/main.py seed_settings), so this value reaches a container over
      # a FRESH archive.db; over a redeploy that booted before, the stored
      # endpoint wins and must be corrected in the settings UI (or delete the
      # key from archive.db).
      TOR_SOCKS_URL: "socks5h://online-video-archiver:9051"
      # Optional: pin the DNS cache's upstream resolver (e.g. "1.1.1.1" for
      # Cloudflare's DoH-on-resolver endpoint) to bypass the host chain
      # for this container. Unset = discover whatever upstream
      # Docker set up. See docs/anti-bot-egress.md.
      # DNS_UPSTREAM: ""
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  # PO-token provider peer (see docs/anti-bot-egress.md). This is the SERVER
  # half of bgutil-ytdlp-pot-provider; the yt-dlp plugin half is pip-installed
  # inside the archiver image. yt-dlp talks to it over the implicit compose
  # network (host = service name). We deliberately publish NO port to the host:
  # the server is unauthenticated, and keeping it inside the compose network
  # prevents stray local clients from minting tokens / spending resources
  # through it. The image binds all interfaces internally so peer lookup works
  # without any port forwarding. shm_size guards the JS runtime's canvas
  # rendering memory the way browser containers do.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot
    restart: unless-stopped
    shm_size: 1g
